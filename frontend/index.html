<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIEM Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: '#0f172a',
                        darker: '#0b1120',
                        accent: '#3b82f6',
                        success: '#10b981',
                        warning: '#f59e0b',
                        danger: '#ef4444',
                        info: '#3b82f6'
                    }
                }
            }
        }
    </script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Add FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .severity-critical, .severity-high { border-left: 4px solid #ef4444; }
        .severity-medium { border-left: 4px solid #f59e0b; }
        .severity-info, .severity-low { border-left: 4px solid #3b82f6; }
    </style>
</head>
<body class="min-h-screen flex flex-col pt-5 pb-10 px-5">

<!-- Header -->
<header class="flex justify-between items-center mb-6 glass-panel p-4 rounded-xl shadow-lg">
    <div class="flex items-center gap-3">
        <i class="fas fa-shield-alt text-3xl text-accent"></i>
        <h1 class="text-2xl font-bold tracking-wider">SIEM <span class="text-accent">DASHBOARD</span></h1>
    </div>
    <div class="flex gap-4 items-center">
        <div class="text-sm text-gray-400" id="last-updated">Last updated: Just now</div>
        <button onclick="refreshData()" class="bg-accent hover:bg-blue-600 px-4 py-2 rounded shadow transition-all"><i class="fas fa-sync-alt mr-2"></i>Refresh</button>
    </div>
</header>

<div class="grid grid-cols-1 lg:grid-cols-4 gap-6 mb-6">
    <!-- Log Ingestion Panel -->
    <div class="glass-panel p-5 rounded-xl col-span-1 shadow-lg">
        <h2 class="text-xl font-semibold mb-4 border-b border-gray-700 pb-2"><i class="fas fa-upload mr-2 text-gray-400"></i>Ingest Logs</h2>
        <form id="ingest-form" class="flex flex-col gap-3">
            <div>
                <label class="block text-sm text-gray-400 mb-1">Log Type</label>
                <select id="log-type" class="w-full bg-darker border border-gray-700 rounded p-2 text-sm focus:outline-none focus:border-accent">
                    <option value="syslog">Syslog</option>
                    <option value="auth">Auth Log (auth.log)</option>
                    <option value="nginx">Nginx Access Log</option>
                    <option value="windows_json">Windows Events (JSONL)</option>
                </select>
            </div>
            <div>
                <label class="block text-sm text-gray-400 mb-1">Upload File</label>
                <input type="file" id="log-file" class="w-full text-sm file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:bg-gray-700 file:text-white hover:file:bg-gray-600"/>
            </div>
            <button type="submit" class="mt-2 bg-success hover:bg-emerald-600 py-2 rounded transition-all text-sm font-semibold shadow">Upload & Process</button>
        </form>
        <div id="ingest-status" class="mt-3 text-sm text-center hidden"></div>
    </div>
    
    <!-- Charts -->
    <div class="glass-panel p-5 rounded-xl col-span-1 lg:col-span-3 shadow-lg flex flex-col">
        <h2 class="text-xl font-semibold mb-4 border-b border-gray-700 pb-2"><i class="fas fa-chart-line mr-2 text-accent"></i>Analytics Overview</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 h-full">
            <div class="bg-darker rounded p-2 border border-gray-800 flex items-center justify-center h-48">
                <canvas id="timelineChart"></canvas>
            </div>
            <div class="bg-darker rounded p-2 border border-gray-800 flex items-center justify-center h-48">
                <canvas id="topIpChart"></canvas>
            </div>
            <div class="bg-darker rounded p-2 border border-gray-800 flex items-center justify-center h-48">
                <canvas id="categoryChart"></canvas>
            </div>
        </div>
    </div>
</div>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-6 h-[600px]">
    <!-- Live Event Feed -->
    <div class="glass-panel p-5 rounded-xl col-span-1 lg:col-span-2 shadow-lg flex flex-col h-full">
        <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">
            <h2 class="text-xl font-semibold"><i class="fas fa-list mr-2 text-info"></i>Live Event Feed</h2>
            
            <div class="flex gap-2 text-sm max-w-md w-full">
                <select id="filter-severity" class="bg-darker border border-gray-700 rounded p-1.5 focus:outline-none">
                    <option value="">All Sev</option>
                    <option value="high">High/Crit</option>
                    <option value="medium">Medium</option>
                    <option value="info">Info</option>
                </select>
                <input type="text" id="filter-keyword" placeholder="Search keyword..." class="bg-darker border border-gray-700 rounded p-1.5 focus:outline-none flex-grow" />
                <button onclick="fetchEvents()" class="bg-gray-700 hover:bg-gray-600 px-3 rounded"><i class="fas fa-search"></i></button>
            </div>
        </div>
        <div class="overflow-y-auto flex-grow scrollbar-hide pr-2" id="event-feed">
            <!-- Events -->
            <div class="text-center text-gray-500 py-10">No events found. Ingest some logs to start.</div>
        </div>
    </div>

    <!-- Alert Panel -->
    <div class="glass-panel p-5 rounded-xl col-span-1 shadow-lg flex flex-col h-full">
        <h2 class="text-xl font-semibold mb-4 border-b border-gray-700 pb-2 text-danger flex items-center gap-2">
            <i class="fas fa-exclamation-triangle"></i> Active Alerts <span id="alert-count" class="bg-danger text-white text-xs py-0.5 px-2 rounded-full hidden">0</span>
        </h2>
        <div class="overflow-y-auto flex-grow scrollbar-hide space-y-3" id="alert-feed">
            <div class="text-center text-gray-500 py-10">All clear. No active alerts.</div>
        </div>
    </div>
</div>

<script>
    // Config Chart JS Defaults
    Chart.defaults.color = '#94a3b8';
    Chart.defaults.borderColor = 'rgba(255,255,255,0.05)';

    let charts = {};

    async function init() {
        await refreshData();
        // Auto refresh every 10 seconds
        setInterval(refreshData, 10000);
    }

    async function refreshData() {
        try {
            await Promise.all([
                fetchEvents(),
                fetchAlerts(),
                updateCharts()
            ]);
            document.getElementById('last-updated').innerText = `Last updated: ${new Date().toLocaleTimeString()}`;
        } catch (e) {
            console.error("Error refreshing data:", e);
        }
    }

    function getSeverityColor(sev) {
        sev = sev.toLowerCase();
        if (sev === 'critical' || sev === 'high') return 'text-danger bg-red-900/20';
        if (sev === 'medium') return 'text-warning bg-amber-900/20';
        return 'text-info bg-blue-900/20';
    }

    async function fetchEvents() {
        const sev = document.getElementById('filter-severity').value;
        const kw = document.getElementById('filter-keyword').value;
        let url = '/api/events?limit=50';
        
        if (sev) url += `&severity=${sev}`;
        if (kw) url += `&keyword=${encodeURIComponent(kw)}`;

        const res = await fetch(url);
        const events = await res.json();
        
        const feed = document.getElementById('event-feed');
        if (events.length === 0) {
            feed.innerHTML = '<div class="text-center text-gray-500 py-10">No events match criteria.</div>';
            return;
        }

        feed.innerHTML = events.map(e => `
            <div class="bg-darker p-3 rounded mb-2 border border-gray-800 ${getSeverityClass(e.severity)} text-sm flex flex-col gap-1 hover:bg-gray-800 transition-colors">
                <div class="flex justify-between items-start">
                    <span class="font-mono text-gray-400 text-xs">${new Date(e.timestamp).toLocaleString()}</span>
                    <span class="px-2 py-0.5 rounded text-xs font-semibold ${getSeverityColor(e.severity)} uppercase">${e.severity}</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="bg-gray-700 text-white text-xs px-1.5 py-0.5 rounded"><i class="fas fa-desktop mr-1"></i>${e.host}</span>
                    <span class="bg-gray-700 text-white text-xs px-1.5 py-0.5 rounded"><i class="fas fa-tag mr-1"></i>${e.category}</span>
                </div>
                <div class="text-gray-200 mt-1 font-mono text-xs break-all">${e.message}</div>
            </div>
        `).join('');
    }

    function getSeverityClass(sev) {
        sev = sev.toLowerCase();
        if (sev === 'critical' || sev === 'high') return 'severity-critical';
        if (sev === 'medium') return 'severity-medium';
        return 'severity-info';
    }

    async function fetchAlerts() {
        const res = await fetch('/api/alerts?limit=20');
        const alerts = await res.json();
        const feed = document.getElementById('alert-feed');
        
        const unacked = alerts.filter(a => a.acknowledged === 0);
        const countBadge = document.getElementById('alert-count');
        if (unacked.length > 0) {
            countBadge.innerText = unacked.length;
            countBadge.classList.remove('hidden');
        } else {
            countBadge.classList.add('hidden');
        }

        if (alerts.length === 0) {
            feed.innerHTML = '<div class="text-center text-gray-500 py-10">No active alerts.</div>';
            return;
        }

        feed.innerHTML = alerts.map(a => `
            <div class="bg-darker p-3 rounded border border-gray-800 ${a.acknowledged ? 'opacity-50' : getSeverityClass(a.severity)} text-sm relative">
                <div class="flex justify-between items-start mb-2">
                    <h3 class="font-bold text-gray-100">${a.rule_name}</h3>
                    ${a.acknowledged === 0 ? 
                        `<button onclick="ackAlert(${a.id})" class="text-xs bg-gray-700 hover:bg-success text-white px-2 py-1 rounded transition-colors" title="Acknowledge"><i class="fas fa-check"></i></button>`
                        : `<span class="text-xs text-success"><i class="fas fa-check-double mr-1"></i>Ack</span>`
                    }
                </div>
                <p class="text-gray-400 text-xs mb-2">${a.description}</p>
                <div class="flex justify-between items-center text-xs">
                    <span class="text-gray-500">${new Date(a.timestamp).toLocaleString()}</span>
                    <span class="bg-gray-800 px-2 rounded py-0.5"><i class="fas fa-layer-group mr-1"></i>${a.events_correlated} events</span>
                </div>
            </div>
        `).join('');
    }

    async function ackAlert(id) {
        await fetch(`/api/alerts/${id}/acknowledge`, { method: 'PUT' });
        fetchAlerts();
    }

    async function updateCharts() {
        await Promise.all([
            loadTimelineChart(),
            loadTopIpChart(),
            loadCategoryChart()
        ]);
    }

    async function loadTimelineChart() {
        const res = await fetch('/api/stats/timeline');
        const data = await res.json();
        
        const ctx = document.getElementById('timelineChart').getContext('2d');
        if (charts.timeline) charts.timeline.destroy();
        
        charts.timeline = new Chart(ctx, {
            type: 'line',
            data: {
                labels: data.map(d => d.time.split(' ')[1]), // Just the hour
                datasets: [{
                    label: 'Events / Hour',
                    data: data.map(d => d.count),
                    borderColor: '#3b82f6',
                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.4,
                    pointRadius: 2
                }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, title: { display: true, text: 'Events past 24h'} }, scales: { x: { grid: { display: false } } } }
        });
    }

    async function loadTopIpChart() {
        const res = await fetch('/api/stats/top-ips');
        const data = await res.json();
        
        const ctx = document.getElementById('topIpChart').getContext('2d');
        if (charts.topIp) charts.topIp.destroy();
        
        charts.topIp = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: data.map(d => d.host.substring(0, 15)),
                datasets: [{
                    label: 'Events',
                    data: data.map(d => d.count),
                    backgroundColor: '#8b5cf6',
                    borderRadius: 4
                }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, title: { display: true, text: 'Top Source Hosts'} }, scales: { x: { grid: { display: false } } } }
        });
    }

    async function loadCategoryChart() {
        const res = await fetch('/api/stats/categories');
        const data = await res.json();
        
        const ctx = document.getElementById('categoryChart').getContext('2d');
        if (charts.category) charts.category.destroy();
        
        charts.category = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: data.map(d => d.category),
                datasets: [{
                    data: data.map(d => d.count),
                    backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#64748b'],
                    borderWidth: 0
                }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { boxWidth: 10, font: {size: 10} } }, title: { display: true, text: 'Categories'} }, cutout: '70%'}
        });
    }

    // Handle Form Submit
    document.getElementById('ingest-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fileInput = document.getElementById('log-file');
        const typeInput = document.getElementById('log-type');
        const statusDiv = document.getElementById('ingest-status');
        
        if (!fileInput.files[0]) {
            statusDiv.innerHTML = '<span class="text-warning">Please select a file.</span>';
            statusDiv.classList.remove('hidden');
            return;
        }

        const formData = new FormData();
        formData.append('log_type', typeInput.value);
        formData.append('file', fileInput.files[0]);

        statusDiv.innerHTML = '<span class="text-info"><i class="fas fa-spinner fa-spin mr-2"></i>Uploading...</span>';
        statusDiv.classList.remove('hidden');

        try {
            const res = await fetch('/api/ingest/file', {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            
            if (res.ok) {
                statusDiv.innerHTML = `<span class="text-success"><i class="fas fa-check-circle mr-2"></i>${data.message}</span>`;
                fileInput.value = '';
                refreshData();
            } else {
                statusDiv.innerHTML = `<span class="text-danger">Error: ${data.detail || 'Upload failed'}</span>`;
            }
        } catch (err) {
            statusDiv.innerHTML = `<span class="text-danger">Error: ${err.message}</span>`;
        }
        
        setTimeout(() => { statusDiv.classList.add('hidden'); }, 5000);
    });

    // Run tests explicitly matching event listeners
    document.getElementById('filter-keyword').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            fetchEvents();
        }
    });

    Object.assign(window, { refreshData, fetchEvents, ackAlert });
    init();
</script>
</body>
</html>
