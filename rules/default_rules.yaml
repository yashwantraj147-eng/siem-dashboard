rules:
  - name: "Brute Force Attempt"
    description: "Multiple failed login attempts detected."
    mitre_technique: "T1110.001"
    mitre_tactic: "Credential Access"
    condition:
      field: severity
      operator: equals
      value: "high"
      category: "auth"
    threshold: 5
    time_window: 60
    severity: "critical"

  - name: "Multiple 404 Errors"
    description: "Potential directory traversal or web vulnerability scanning."
    mitre_technique: "T1595.002"
    mitre_tactic: "Reconnaissance"
    condition:
      field: message
      operator: contains
      value: "404"
      category: "web"
    threshold: 10
    time_window: 60
    severity: "medium"

  - name: "Privilege Escalation Activity"
    description: "User attempting sudo command."
    mitre_technique: "T1548.003"
    mitre_tactic: "Privilege Escalation"
    condition:
      field: message
      operator: contains
      value: "sudo:"
      category: "auth"
    threshold: 1
    time_window: 0
    severity: "high"

  - name: "Repeated Web Rejections"
    description: "Lots of 403 Forbidden responses."
    mitre_technique: "T1190"
    mitre_tactic: "Initial Access"
    condition:
      field: message
      operator: contains
      value: "Status 403"
    threshold: 5
    time_window: 60
    severity: "medium"

  - name: "Suspicious Windows Event"
    description: "Security audit log was cleared (EventID 1102)."
    mitre_technique: "T1070.001"
    mitre_tactic: "Defense Evasion"
    condition:
      field: message
      operator: contains
      value: "EventID 1102"
      category: "windows"
    threshold: 1
    time_window: 0
    severity: "critical"

  - name: "SSH Connection Opened"
    description: "Info level SSH connection."
    mitre_technique: "T1021.004"
    mitre_tactic: "Lateral Movement"
    condition:
      field: message
      operator: contains
      value: "Accepted password"
      category: "auth"
    threshold: 1
    time_window: 0
    severity: "info"

  - name: "Malware Download Attempt"
    description: "Request for suspicious executable file extension."
    mitre_technique: "T1204.002"
    mitre_tactic: "Execution"
    condition:
      field: message
      operator: contains
      value: ".exe"
      category: "web"
    threshold: 1
    time_window: 0
    severity: "high"

  - name: "Database Injection Attempt"
    description: "SQL injection syntax detected in web request."
    mitre_technique: "T1190"
    mitre_tactic: "Initial Access"
    condition:
      field: message
      operator: contains
      value: "UNION SELECT"
      category: "web"
    threshold: 1
    time_window: 0
    severity: "critical"

  - name: "Multiple SSH Failures"
    description: "Repeated SSH authentication password failures."
    mitre_technique: "T1110.001"
    mitre_tactic: "Credential Access"
    condition:
      field: message
      operator: contains
      value: "Failed password"
      category: "auth"
    threshold: 3
    time_window: 60
    severity: "high"

  - name: "High Severity System Event"
    description: "System kernel fatal error reported."
    mitre_technique: "T1499"
    mitre_tactic: "Impact"
    condition:
      field: severity
      operator: equals
      value: "high"
      category: "system"
    threshold: 1
    time_window: 0
    severity: "high"
